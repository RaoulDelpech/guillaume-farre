name: Deploy to VPS IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/guillaumefarre
            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rm -rf app/api/account
            echo "Installing dependencies..."
            # Option A (supply chain mitigation): use bun instead of npm.
            # bun.lock pins eslint-import-resolver-typescript@3.8.3 (pre unrs-resolver),
            # bypassing the suspicious napi-postinstall -> unrs-resolver chain which
            # is the most likely vector for the persistent VPS malware (audit 2026-04-11).
            # --frozen-lockfile aborts on any drift: no silent lock rewrite in prod.
            # No `|| echo` camouflage: a failing install MUST fail the deploy loudly.
            bun install --frozen-lockfile
            echo "Writing env..."
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" > .env.local
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" >> .env.local
            echo "NEXT_PUBLIC_SITE_URL=https://guillaumefarre.com" >> .env.local
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env.local
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env.local
            echo "SITE_PASSWORD=${{ secrets.SITE_PASSWORD }}" >> .env.local
            echo "SITE_MODE=public" >> .env.local
            echo "Fixing tsconfig (remove same-runtime artifact)..."
            python3 -c "import json; f=open('tsconfig.json'); d=json.load(f); f.close(); d.get('compilerOptions',{}).pop('jsxImportSource',None); f=open('tsconfig.json','w'); json.dump(d,f,indent=2); f.close()"
            echo "Cleaning build cache..."
            rm -rf .next
            echo "Building with increased memory..."
            NODE_OPTIONS="--max-old-space-size=4096" bun run build
            echo "Restarting PM2..."
            pm2 restart guillaumefarre || pm2 start npm --name guillaumefarre -- start
            sleep 10
            echo "Checking port 3000..."
            ss -tlnp | grep 3000 || echo "Port 3000 not listening!"
            curl -s -o /dev/null -w "localhost: %{http_code}\n" http://localhost:3000/ || echo "localhost failed"
            echo "Deploy complete!"

name: Deploy to VPS OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # NOTE (2026-04-11): le build est execute SUR le VPS via SSH (appleboy/ssh-action),
    # pas sur le runner GitHub. Par consequent :
    # - setup-bun@v2 ici serait inutile (le runner n'execute aucun bun run).
    # - bun DOIT etre preinstalle sur le VPS 57.131.23.96 lors du bootstrap.
    # Commande bootstrap VPS (a executer manuellement 1 fois par Raoul) :
    #   curl -fsSL https://bun.sh/install | bash
    #   echo 'export BUN_INSTALL="$HOME/.bun"' >> ~/.bashrc
    #   echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> ~/.bashrc
    # Node >= 20 egalement requis pour next 15.5 :
    #   curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
    #   sudo apt-get install -y nodejs
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Fail-fast : ANY failure aborts the deploy (avant : pm2 restart continuait
            # meme apres un bun run build casse, masquant un crashloop en "success").
            # Incident reference : Sprint 3 merge 0ae7cd1 (16/05) crashloop 104x.
            set -e
            set -o pipefail
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            cd /var/www/guillaumefarre
            echo "Backing up runtime data..."
            cp data/newsletter-subscribers.json /tmp/newsletter-subscribers.json 2>/dev/null || true
            cp data/photo-metadata.json /tmp/photo-metadata.json 2>/dev/null || true
            echo "Snapshotting data files (rotated backup)..."
            # Snapshot des donnees critiques (toiles, reservations, vip-codes) dans
            # data/backups/{ISO}/ avec rotation BACKUP_RETENTION_COUNT (defaut 30).
            # Politique : si la branche en cours ne contient pas encore
            # scripts/backup-data.ts (cas du tout premier deploy post-merge),
            # OU si le script echoue, on n'echoue PAS le deploy — mais l'incident
            # DOIT etre visible dans le log GitHub Actions via ::warning::
            # (rendu en jaune dans le summary du run, traceable).
            if [ -f scripts/backup-data.ts ]; then
              export BACKUP_RETENTION_COUNT="${BACKUP_RETENTION_COUNT:-30}"
              if bun run scripts/backup-data.ts; then
                echo "Backup snapshot OK"
              else
                BACKUP_EXIT_CODE=$?
                echo "::warning title=Backup failed::BACKUP FAILED — DEPLOY CONTINUED. scripts/backup-data.ts exited with code $BACKUP_EXIT_CODE. Check the VPS data/backups/ directory and the script output above for details. Without a fresh snapshot, a rollback of toiles/reservations/vip-codes will rely on the previous backup only."
              fi
            else
              echo "::warning title=Backup script missing::scripts/backup-data.ts not present on this checkout — no snapshot taken. This is expected only for the very first deploy after merging the backup pipeline; subsequent deploys without the script must be investigated."
            fi
            echo "Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "Restoring runtime data..."
            cp /tmp/newsletter-subscribers.json data/newsletter-subscribers.json 2>/dev/null || true
            cp /tmp/photo-metadata.json data/photo-metadata.json 2>/dev/null || true
            rm -rf app/api/account
            echo "Installing dependencies..."
            # Option A (supply chain mitigation): use bun instead of npm.
            # bun.lock pins eslint-import-resolver-typescript@3.8.3 (pre unrs-resolver),
            # bypassing the suspicious napi-postinstall -> unrs-resolver chain which
            # is the most likely vector for the persistent VPS malware (audit 2026-04-11).
            # --frozen-lockfile aborts on any drift: no silent lock rewrite in prod.
            # No `|| echo` camouflage: a failing install MUST fail the deploy loudly.
            bun install --frozen-lockfile
            echo "Writing env..."
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" > .env.local
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" >> .env.local
            # STRIPE_WEBHOOK_SECRET : signing secret du webhook endpoint Stripe LIVE
            # (https://guillaumefarre.com/api/stripe/webhook). Sans cette variable,
            # app/api/stripe/webhook/route.ts:25 rejette TOUTE requete webhook en 500
            # — donc paid -> reservation/order jamais marquees, emails jamais envoyes.
            # Source : Stripe Dashboard > Webhooks > endpoint > Signing secret. Ajoute
            # au GitHub repo secret par Raoul 16/05 apres incident Sprint 4 partial.
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env.local
            echo "NEXT_PUBLIC_SITE_URL=https://guillaumefarre.com" >> .env.local
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env.local
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env.local
            echo "SITE_PASSWORD=${{ secrets.SITE_PASSWORD }}" >> .env.local
            echo "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" >> .env.local
            # MAGIC_LINK_SECRET : HMAC secret pour signature contrats VIP (Sprint 3) ET
            # cookie VIP (lib/vip-cookie.ts). Absence -> crash build sur lib/contract-signing.ts
            # et lib/magic-link.ts. Source : GitHub repo secret (ajoute par Raoul 16/05).
            echo "MAGIC_LINK_SECRET=${{ secrets.MAGIC_LINK_SECRET }}" >> .env.local
            echo "SITE_MODE=public" >> .env.local
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.local
            echo "RESEND_FROM_EMAIL=Guillaume Farré <noreply@guillaumefarre.com>" >> .env.local
            echo "Fixing tsconfig (remove same-runtime artifact)..."
            python3 -c "import json; f=open('tsconfig.json'); d=json.load(f); f.close(); d.get('compilerOptions',{}).pop('jsxImportSource',None); f=open('tsconfig.json','w'); json.dump(d,f,indent=2); f.close()"
            echo "Clearing entire .next cache (stale images after crop)..."
            rm -rf .next
            echo "Building (clean)..."
            NODE_OPTIONS="--max-old-space-size=4096" bun run build
            # Fast-fail explicite : si .next/BUILD_ID est absent, le build n'a rien produit
            # d'utilisable et PM2 va crashlooper. On stoppe AVANT pm2 restart.
            # Necessaire en complement de set -e car bun pourrait theoriquement exit 0
            # sur un build partiel (cf. incident Sprint 3).
            echo "Verifying build output..."
            test -f .next/BUILD_ID || { echo "::error title=Build artifact missing::Build did not produce .next/BUILD_ID — aborting deploy to preserve current running version"; exit 1; }
            echo "Build verified: BUILD_ID=$(cat .next/BUILD_ID)"
            echo "Restarting PM2..."
            pm2 restart guillaumefarre || pm2 start npm --name guillaumefarre -- start
            sleep 10
            echo "Checking port 3000..."
            ss -tlnp | grep 3000 || echo "Port 3000 not listening!"
            curl -s -o /dev/null -w "localhost: %{http_code}\n" http://localhost:3000/ || echo "localhost failed"
            echo "Deploy complete!"

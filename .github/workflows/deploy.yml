name: Deploy to VPS IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/guillaume-farre
            echo "📦 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm install
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" > .env.local
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}" >> .env.local
            echo "NEXT_PUBLIC_SITE_URL=https://guillaumefarre.com" >> .env.local
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env.local
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env.local
            echo "🔨 Building with increased memory..."
            NODE_OPTIONS="--max-old-space-size=4096" npm run build
            pm2 restart guillaumefarre
            echo "🔍 Checking nginx status..."
            sudo systemctl status nginx || echo "nginx not running via systemctl"
            sudo nginx -t || echo "nginx config test failed"
            sudo systemctl restart nginx || sudo service nginx restart || echo "Failed to restart nginx"
            echo "🔍 Checking open ports..."
            ss -tlnp | grep -E ':80|:443' || echo "Ports 80/443 not listening"
            echo "🔍 Checking firewall..."
            sudo ufw status || echo "ufw not available"
            sudo iptables -L INPUT -n | head -20 || echo "iptables failed"
            echo "🔍 Opening firewall ports..."
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
            echo "🔍 Testing local access..."
            curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "localhost:3000 failed"
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/ || echo "127.0.0.1:80 failed"
            echo "🔍 Network interfaces..."
            ip addr show | grep -E "inet |state UP"
            echo "🔍 Nginx config sites..."
            ls -la /etc/nginx/sites-enabled/ || true
            cat /etc/nginx/sites-available/guillaumefarre.com 2>/dev/null | head -50
            echo "🔍 Testing public IP from server..."
            curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 http://51.38.35.238/ || echo "public IP failed"
            curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://guillaumefarre.com/ || echo "domain failed"
            echo "🔍 Nginx error logs..."
            sudo tail -20 /var/log/nginx/error.log || true
            echo "🔍 Checking IP address..."
            curl -s ifconfig.me || true
            echo "✅ Déploiement terminé !"
